spring.application.name=cloudscale-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudscale}
spring.datasource.username=${DB_USERNAME:cloudscale_user}
spring.datasource.password=${DB_PASSWORD:CloudScaleLocal2026}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
